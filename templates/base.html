<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="personal website of Sam Dixon." />
        <meta name="author" content="Sam Dixon" />
        <meta name="keywords" content="Sam Dixon Indianapolis, IN" />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Sam Dixon" />
        <meta property="og:description" content="Personal website of Sam Dixon." />
        <meta property="og:url" content="https://sdixon.org" />
        <meta property="og:image" content="https://sdixon.org/static/img/wizard.png" />
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="Sam Dixon" />
        <meta name="twitter:description" content="Personal website of Sam Dixon." />
        <meta name="twitter:image" content="https://sdixon.org/static/img/wizard.png" />
        <link rel="icon" href="/static/img/wizard.png" sizes="any" />
        <title>sdixon</title>
    </head>
    <body>
        <style>
            :root {
                /* Zero-request type stacks. Charter ships with macOS/iOS,
                   Sitka with Windows 8.1+, Cambria with Windows/Office,
                   Georgia with essentially everything else. */
                --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
                --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
                        "Liberation Mono", monospace;

                --desk: hsl(30,14%,84%);
                --paper: hsl(32,16%,96%);
                --ink: hsl(28,26%,25%);
                --ink-strong: hsl(28,30%,18%);
                --ink-soft: hsl(28,20%,42%);
                --rule: hsl(28,15%,86%);

                /* Accent picked off the wizard's robe. */
                --link: hsl(215,45%,34%);
                --link-hover: hsl(215,55%,25%);
            }

            *, *::before, *::after {
                box-sizing: border-box;
            }

            body {
                font-family: var(--serif);
                font-size: 16px;
                line-height: 1.6;
                color: var(--ink);
                background-color: var(--desk);
                margin: 0;
                /* Off-centre, as before — but stated once, on one element. */
                padding: 5rem 1.5rem 4rem 15rem;
            }
            @media (max-width: 62rem) {
                body { padding-left: 7rem; }
            }
            @media (max-width: 44rem) {
                body { padding: 2.5rem 1.25rem 3rem; }
            }

            /* ── The card itself ───────────────────────── */
            .paper {
                max-width: 26rem;
                background-color: var(--paper);
                background-image: linear-gradient(hsl(32,20%,97.5%), hsl(32,14%,95%));
                border: 1px solid hsl(30,16%,84%);
                border-radius: 3px;
                padding: 2.2rem 2.4rem 2.4rem;
                box-shadow:
                    0 1px 1px   hsl(30 25% 28% / .13),
                    0 4px 8px   hsl(30 25% 28% / .10),
                    0 12px 26px hsl(30 25% 28% / .12),
                    0 26px 54px hsl(30 25% 28% / .09);
            }
            /* Front page keeps roughly the proportions of a real 3.5×2in card. */
            .paper.card {
                min-height: 14.9rem;
            }
            /* Inner pages are the same stock, just a taller sheet. */
            .paper.sheet {
                max-width: 34rem;
            }
            @media (max-width: 44rem) {
                .paper { padding: 1.6rem 1.5rem 1.8rem; }
                .paper.card { min-height: 0; }
            }

            a {
                color: var(--link);
                font-style: italic;
                text-decoration: none;
                transition: color 0.15s ease;
            }
            a:hover {
                color: var(--link-hover);
                text-decoration: underline;
                text-decoration-thickness: 1px;
                text-underline-offset: 0.15em;
            }
            a:focus-visible {
                outline: 2px solid var(--link);
                outline-offset: 2px;
                border-radius: 1px;
            }
            p {
                margin: 1rem 0;
            }

            /* ── Frontpage ─────────────────────────────── */
            .name-row {
                display: flex;
                align-items: center;
                gap: 0.7rem;
                margin: 0 0 1.4rem;
            }
            h1.name {
                font-size: 1.7rem;
                font-style: italic;
                letter-spacing: -0.01em;
                margin: 0;
                color: var(--ink-strong);
            }
            .wizard {
                width: 40px;
                height: 40px;
                image-rendering: pixelated;
                flex-shrink: 0;
            }
            .links {
                display: grid;
                grid-template-columns: auto 1fr;
                gap: 0.35rem 2.2rem;
            }
            .link-row {
                display: contents;
            }
            .link-label {
                color: var(--ink-soft);
                font-size: 0.85rem;
                font-family: var(--mono);
                letter-spacing: 0.02em;
                white-space: nowrap;
            }
            .link-value {
                font-size: 0.92rem;
            }
            a[href^="mailto:"] {
                font-family: var(--mono);
                font-size: 0.9em;
            }

            /* ── Inner pages ────────────────────────────── */
            .site-header {
                margin-bottom: 2.2rem;
            }
            .site-header a.home {
                font-family: var(--mono);
                font-size: 0.9rem;
                font-weight: 700;
                letter-spacing: -0.04em;
                display: inline-flex;
                align-items: center;
                gap: 0.3rem;
            }
            .site-header a.home::before {
                content: "↜";
                font-style: normal;
                font-weight: 400;
            }
            h2.page-title {
                font-size: 1.5rem;
                font-weight: 700;
                letter-spacing: -0.01em;
                margin: 0 0 1.5rem;
                color: var(--ink-strong);
            }
            h3 {
                font-size: 1rem;
                font-weight: 700;
                margin: 0 0 0.4rem;
                color: hsl(28,26%,22%);
            }
            article {
                margin: 2rem 0;
                padding-bottom: 2rem;
                border-bottom: 1px solid var(--rule);
            }
            article:first-of-type { margin-top: 0; }
            article:last-of-type {
                padding-bottom: 0;
                border-bottom: none;
            }
            blockquote {
                margin: 0.75rem 0 0;
                padding: 0.9rem 1.2rem;
                background-color: hsl(32,18%,93.5%);
                border-left: 3px solid hsl(215,30%,62%);
                border-radius: 0 2px 2px 0;
                font-size: 0.92rem;
            }
            blockquote p {
                margin: 0.4rem 0;
            }
            blockquote p:first-child { margin-top: 0; }
            blockquote p:last-child  { margin-bottom: 0; }
            blockquote footer {
                margin-top: 0.75rem;
                font-style: italic;
                font-size: 0.88em;
                color: hsl(28,24%,38%);
            }
        </style>

        <div class="paper {% block stock %}sheet{% endblock %}">
            {% block page %}
            <header class="site-header">
                <a href="{{ url_for('index') }}" class="home">sam dixon</a>
            </header>
            <main>
                {% block content %}{% endblock %}
            </main>
            {% endblock %}
        </div>
    </body>
</html>
